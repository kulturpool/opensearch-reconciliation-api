# =============================================================================
# Docker Compose Konfiguration für Production/Runtime
# =============================================================================
# Dieses Setup verwendet das veröffentlichte API-Image aus GHCR.
# Alle Konfigurationswerte befinden sich direkt in dieser Datei.
#
# Start:
#   docker compose up -d
#
# Logs:
#   docker compose logs -f
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # OpenSearch Reconciliation API: Hauptanwendung
  # ---------------------------------------------------------------------------
  opensearch-reconciliation-api:
    image: ghcr.io/kulturpool/opensearch-reconciliation-api:latest

    environment:
      # -----------------------------------------------------------------------
      # API Configuration
      # -----------------------------------------------------------------------
      API_PORT: "8083"
      PUBLIC_BASE_URL: "http://localhost:8083"

      # -----------------------------------------------------------------------
      # OpenSearch Configuration
      # -----------------------------------------------------------------------
      # "opensearch" entspricht dem Service-Namen weiter unten.
      OPENSEARCH_HOST: "opensearch"
      OPENSEARCH_PORT: "9200"

      # -----------------------------------------------------------------------
      # GND Index Configuration
      # -----------------------------------------------------------------------
      GND_INDEX_NAME: "gnd"
      GND_FORCE_REINDEX: "false"
      GND_INDEX_ENTITYFACTS: "true"

      # Leer lassen, um alle von EntityFacts unterstützten Typen anzureichern.
      GND_ENTITYFACTS_ONLY_TYPE: ""

      # -----------------------------------------------------------------------
      # Data Paths
      # -----------------------------------------------------------------------
      # Relativ zu WORKDIR=/app im API-Container.
      GND_DATA_DIR: "data"

      # -----------------------------------------------------------------------
      # GND Index Build State Configuration
      # -----------------------------------------------------------------------
      # 12 Stunden
      GND_INDEX_LOCK_STALE_SECONDS: "43200"

      # -----------------------------------------------------------------------
      # GND Update Scheduler Configuration
      # -----------------------------------------------------------------------
      GND_AUTO_UPDATE: "true"

      # 168 Stunden = 7 Tage
      GND_UPDATE_INTERVAL_HOURS: "168"

      # 300 Sekunden = 5 Minuten
      GND_UPDATE_INITIAL_DELAY_SECONDS: "300"

      GND_UPDATE_MODE: "oai"

      # 21600 Sekunden = 6 Stunden
      GND_UPDATE_LOCK_STALE_SECONDS: "21600"

      # -----------------------------------------------------------------------
      # GND OAI-PMH Harvesting Configuration
      # -----------------------------------------------------------------------
      GND_OAI_BASE_URL: "https://services.dnb.de/oai/repository"
      GND_OAI_SET: "authorities"
      GND_OAI_METADATA_PREFIX: "RDFxml"
      GND_OAI_OVERLAP_MINUTES: "60"

      GND_OAI_REQUEST_TIMEOUT_SECONDS: "300"
      GND_OAI_REQUEST_MAX_RETRIES: "6"
      GND_OAI_REQUEST_BACKOFF_SECONDS: "10"
      GND_OAI_PAGE_DELAY_SECONDS: "2"

      # -----------------------------------------------------------------------
      # GND Record Upsert Configuration
      # -----------------------------------------------------------------------
      GND_RECORD_JSONLD_URL_TEMPLATE: "https://d-nb.info/gnd/{id}/about/lds.jsonld"

      GND_UPSERT_REQUEST_DELAY_SECONDS: "0.25"
      GND_UPSERT_REQUEST_MAX_RETRIES: "5"
      GND_UPSERT_REQUEST_BACKOFF_SECONDS: "2"
      GND_UPSERT_FAILED_IDS_FILE: "data/state/oai_failed_ids.jsonl"

      # -----------------------------------------------------------------------
      # Getty Vocabulary Configuration
      # -----------------------------------------------------------------------
      GETTY_INDEX_NAME: "getty"

      # Unterstützte Werte: aat, ulan, tgn
      GETTY_VOCABULARIES: "aat,ulan,tgn"

      GETTY_FORCE_REINDEX: "false"
      GETTY_AUTO_UPDATE: "true"

      # 336 Stunden = 14 Tage
      GETTY_UPDATE_INTERVAL_HOURS: "336"

      # 600 Sekunden = 10 Minuten
      GETTY_UPDATE_INITIAL_DELAY_SECONDS: "600"

      # 43200 Sekunden = 12 Stunden
      GETTY_INDEX_LOCK_STALE_SECONDS: "43200"

      # 21600 Sekunden = 6 Stunden
      GETTY_UPDATE_LOCK_STALE_SECONDS: "21600"

      GETTY_RAW_DIR: "data/raw/getty"

      # {vocab} wird durch aat, ulan oder tgn ersetzt.
      GETTY_DOWNLOAD_URL_TEMPLATE: "http://{vocab}downloads.getty.edu/VocabData/explicit.zip"

    # Host-Port 8083 -> Container-Port 8083
    ports:
      - "8083:8083"

    volumes:
      # GND-/Getty-Daten, Logs und Statusdateien
      - ./data:/app/data

      # Beibehalten, wenn Konfiguration zur Laufzeit überschrieben werden soll.
      - ./config:/app/config

    depends_on:
      opensearch:
        condition: service_healthy

    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # OpenSearch: Suchmaschine für GND- und Getty-Index
  # ---------------------------------------------------------------------------
  opensearch:
    image: opensearchproject/opensearch:2

    environment:
      # Single-Node Setup für lokale oder kleine Deployments
      discovery.type: "single-node"

      # Security deaktiviert.
      # OpenSearch daher nicht öffentlich über Port 9200 verfügbar machen.
      plugins.security.disabled: "true"

      # Von aktuellen OpenSearch-Images vorausgesetzt.
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: "LocalDevPassword123!"

      # Java Heap
      OPENSEARCH_JAVA_OPTS: "-Xms2g -Xmx2g"

    ulimits:
      memlock:
        soft: -1
        hard: -1

      nofile:
        soft: 65536
        hard: 65536

    volumes:
      # OpenSearch-Indizes werden direkt im lokalen Repository gespeichert.
      - ./data/opensearch:/usr/share/opensearch/data

    healthcheck:
      test:
        - "CMD-SHELL"
        - "curl -fs http://localhost:9200 >/dev/null || exit 1"
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 30s

    restart: unless-stopped
